  <script>
    // Simple password strength meter
    document.addEventListener('DOMContentLoaded', function() {
      const input = document.getElementById('newPassword');
      const meter = document.querySelector('[data-strength]');
      const text = document.querySelector('[data-strength-text]');
      if (!input || !meter) return;
      input.addEventListener('input', function() {
        const v = this.value;
        let score = 0;
        if (v.length >= 8) score++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
        if (/\d/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        meter.classList.remove('weak', 'fair', 'good', 'strong');
        const labels = ['Too weak', 'Weak password', 'Fair password', 'Good password', 'Strong password 💪'];
        const classes = ['', 'weak', 'fair', 'good', 'strong'];
        if (v.length > 0) {
          meter.classList.add(classes[score] || 'weak');
        }
        if (text) {
          text.textContent = v.length === 0 ?
            'Use 8+ characters with a mix of letters, numbers & symbols.' :
            labels[score];
        }
      });
    });
  </script>
