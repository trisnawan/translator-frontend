<body>
  <div class="auth-layout auth-centered">

    <!-- Content Side -->
    <div class="auth-content">
      <a href="index.html" class="auth-logo">
        <span class="auth-logo-mark"><i class="bi bi-lightning-charge-fill"></i></span>
        <span>TrendyAdmin</span>
      </a>

      <div class="auth-content-inner">
        <div class="auth-card">
          <div class="auth-card-header">
            <div class="auth-icon">
              <i class="ph ph-shield-check"></i>
            </div>
            <h1 class="auth-title">Two-factor authentication</h1>
            <p class="auth-subtitle">
              Enter the 6-digit code from your authenticator app to finish signing in.
            </p>
          </div>

          <form class="auth-form" novalidate>
            <div class="auth-otp" data-otp>
              <input type="text" inputmode="numeric" maxlength="1" autofocus aria-label="Digit 1">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5">
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6">
            </div>

            <button type="submit" class="auth-submit">Verify Code <i class="ph ph-check"></i></button>
          </form>

          <p class="auth-resend">
            Didn't get a code? <a href="#" class="auth-link">Resend</a> · <a href="#" class="auth-link">Use another method</a>
          </p>

          <p class="auth-footer-text">
            <a href="auth-login.html" class="auth-back"><i class="ph ph-arrow-left"></i> Back to sign in</a>
          </p>
        </div>

  <script>
    // OTP inputs: auto-advance, backspace navigation, paste support
    document.addEventListener('DOMContentLoaded', function() {
      const boxes = document.querySelectorAll('[data-otp] input');
      boxes.forEach(function(box, i) {
        box.addEventListener('input', function() {
          this.value = this.value.replace(/\D/g, '');
          if (this.value && i < boxes.length - 1) {
            boxes[i + 1].focus();
          }
        });
        box.addEventListener('keydown', function(e) {
          if (e.key === 'Backspace' && !this.value && i > 0) {
            boxes[i - 1].focus();
          }
        });
        box.addEventListener('paste', function(e) {
          e.preventDefault();
          const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, boxes.length);
          digits.split('').forEach(function(d, j) {
            boxes[j].value = d;
          });
          if (digits.length) {
            boxes[Math.min(digits.length, boxes.length) - 1].focus();
          }
        });
      });
    });
  </script>
